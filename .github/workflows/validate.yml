name: Validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Run Node tests
        run: npm test
      - name: Run structure check
        run: npm run check:structure
